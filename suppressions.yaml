# 억제 원장 (P13③)
#
# 검사를 끄거나 줄이는 모든 결정은 여기에 기록한다. 필수 필드: check · reason · owner · expiry · issue.
# hooks/pre-commit 이 ① expiry 누락 ② 만료 경과 를 커밋 시점에 차단한다.
#
# 왜 이 파일이 필요한가: v5 `98d923f` 에서 검증자가 찾은 결함 5건을 "실패해도 됨"으로
# 넘겼고, 기한이 없어 프리랜서·전문대 하드제외 우회가 35일간 살아 있었다(§0-C 사례 B).
# 유예는 해결이 아니며, 기한 없는 유예는 해결이 영원히 오지 않는다.

- check: ci-transfer-guarantee
  reason: >-
    pre-push 의 "이관한 검사가 CI 에 실제로 있는가" 보증이 워크플로를 문자열로 파싱한다.
    막을 때마다 새 우회가 나왔다 — 주석 처리 / if: false / 스텝 본문 삭제 / echo 대체 /
    bash -n / bash -c / sh -c : 까지 막았으나, V1 6차에서 다시 4종이 통과했다:
    `bash ; echo <path>` · `bash /dev/null <path>` · `bash "" <path>` · `sh /dev/null <path>`.
    넷 다 스크립트를 한 줄도 실행하지 않는다. `if: ${{ false }}` 같은 임의 항상-거짓 조건과
    파이프 변형도 남아 있다. 문자열 규칙을 하나 추가할 때마다 우회도 하나씩 늘어난다.
    현재 이 보증은 방어 심도이지 1차 방어선이 아니며, 비밀 게이트 3중(pre-commit --index /
    pre-push 고정 / CI 히스토리 blob 스캔)은 이 우회에 영향받지 않는다.
  owner: sangmokang
  expiry: 2026-09-15
  issue: >-
    파싱을 정교화하는 방향은 수익이 체감한다. 실행 증명으로 바꾼다 — CI 가 각 인수 스크립트
    완료 시 마커(job summary·아티팩트·check-run)를 남기고 pre-push 가 최근 성공 run 에서
    조회한다. 워크플로를 어떻게 편집하든 실행하지 않으면 통과할 수 없으므로, 위 우회 전부와
    항상-거짓 조건이 한꺼번에 닫힌다.

- check: p13-deletion-blindspot
  reason: >-
    P13 약화 탐지가 diff 의 추가된 줄(+)만 본다. 검사 줄을 삭제하는 약화는 원리적으로
    탐지되지 않는다. 삭제 diff 검사를 전면 도입하면 리팩터링마다 오탐이 나서 보류했다.
  owner: sangmokang
  expiry: 2026-09-15
  issue: >-
    범위를 CI 워크플로 파일(.github/workflows/*)로 한정하면 오탐이 거의 없다는 데
    V1 과 합의했다 — 그 파일에서 스텝 삭제는 거의 항상 약화다. 그 범위부터 도입한다.

- check: gate-scope-gaps
  reason: >-
    두 게이트의 적용 범위가 좁다. (1) 자기제외 탐지가 verify.sh·scripts/*.sh·hooks/* 만
    보고 .github/workflows/*, .claude/skills/*/local-checks.sh 는 범위 밖이다.
    (2) 외부효과 네트워크 검사가 파일명 기반이라 src/api/types.ts 를 오탐하고
    authenticate.js 를 놓친다.
  owner: sangmokang
  expiry: 2026-09-30
  issue: >-
    (1)은 case 패턴에 두 경로를 추가하면 된다. (2)는 파일명이 아니라 import/호출 그래프
    기반으로 "외부 효과를 내는 모듈"을 판별해야 하며, 소스가 생긴 뒤에 설계한다.

- check: secret-format-gap
  reason: >-
    CREDENTIAL/WEBHOOK/PRIVATE_KEY 세 이름이 환경변수 형식(KEY=value)에서만 탐지되고
    JSON/YAML/JS 인용 형식·camelCase·등호 주변 공백·다중 라인·base64·하이픈 키는
    길이와 무관하게 전부 놓친다. verify.sh:72 가 grep -l 파일명 방식이라 줄 단위
    허용 목록이 없어 지금 닫으면 저장소 오탐 2건(docs/engineering/humansearch-v6-founding-spec-2026-08-07.md,
    scripts/acceptance-secret-webhook-vendor.sh)으로 CI 가 멈춘다.
    같은 이유로 남는 6~11자 잔여 손실도 여기 함께 기록한다(2026-09-03 V1·V2 적대검증
    지적, 이전 항목 keyword-env-value-floor-12 의 미이관분): ① 열거 밖 접미사
    (_DATA·_SIGNING·_CODE 등)는 6~11자 값을 계속 놓친다 ② 숫자가 없는 영문자만의 값과
    . - _ 가 섞인 값도 6~11자 구간에서 놓친다(센티널 오탐 8종을 막으려 숫자를 요구했고,
    그러자 IP·날짜·버전·서비스명 오탐이 들어와 값 문자집합을 영숫자로 좁혔다).
    ③ 남는 오탐: 영숫자만으로 된 짧은 설정 낱말(알고리즘·형식 이름 계열)과 순수 숫자
    값은 실제 비밀과 값 모양이 같아 정규식으로 못 가른다. 2026-09-03 추적 파일 전수·
    히스토리 blob 전량 스캔에서 실제 발생 0건이라 지금은 열어 둔다.
    ④ docker-compose environment 의 `- KEY=value` 시퀀스 표기는 길이와 무관하게 전부
    미탐이다(PASSWORD 같은 최강 키워드 포함). 세 규칙 다 접두를 [A-Za-z0-9_]* 로 잡아
    줄 앞 하이픈을 흡수하지 못한다. PR 이전부터 있던 구멍이며 형식 축 전체와 함께 닫는다.
  owner: sangmokang
  expiry: 2026-09-30
  issue: >-
    2026-09-03 실측으로 오탐 2건을 확인했다(인용형 규칙을 3키워드로 확장해 추적 파일
    전수 스캔): humansearch-v6-founding-spec 515행의 credential_source 필드(값은 자격증명
    자체가 아니라 저장 위치 이름이다), acceptance-secret-webhook-vendor.sh 128행의 Slack
    카나리 줄. 둘 다 비밀이 아니다. ⚠️ 이 항목의 본문에 그 JSON 한 조각을 리터럴로 옮겨
    적었더니 이 파일 자신이 3번째 오탐이 됐다(2026-09-03 codeaudit 이 잡았다) — 억제를
    설명하는 글이 억제 대상을 늘리는 자기오염이라 형태를 끊어 다시 적는다.
    닫는 순서: ① verify.sh 에 줄 단위 허용 목록(경로:줄번호 또는 인라인 마커)을
    먼저 만들고 ② 그 위에서 인용 형식 규칙을 켠다. ①이 없으면 오탐 1건이 곧 전 브랜치
    작업 중단이므로 순서를 바꾸지 않는다.
