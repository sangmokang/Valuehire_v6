name: review-gate

# 현재 PR head에 묶인 조언형 판정만 만든다. 라벨·승인·병합 권한은 쓰지 않는다.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: review-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 현재 기록의 조언형 검토 명부 생성
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/review_gate.py \
            --repo . \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output "$RUNNER_TEMP/review-gate.json" \
            --summary "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/review-gate.json"
