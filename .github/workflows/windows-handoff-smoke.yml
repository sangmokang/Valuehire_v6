name: Windows WSL handoff smoke

on:
  pull_request:
    paths:
      - '.github/workflows/windows-handoff-smoke.yml'
      - '.agents/skills/**'
      - '.codex/skills/**'
      - '.claude/skills/**'
      - 'hooks/**'
      - 'scripts/install-hooks.sh'
      - 'verify.sh'
      - '.secret-patterns.default'
      - 'docs/engineering/development-setup.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wsl-handoff:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Ubuntu in WSL
        shell: pwsh
        run: |
          wsl --install Ubuntu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wsl --list --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clone into WSL filesystem and verify handoff
        shell: pwsh
        run: |
          $source = (wsl -d Ubuntu -- wslpath -u "$env:GITHUB_WORKSPACE" | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $source) { throw 'WSL source path resolution failed' }
          $smoke = @'
          set -euo pipefail
          git clone --no-hardlinks "$1" "$HOME/valuehire-v6"
          cd "$HOME/valuehire-v6"
          test -L .codex/skills/jd
          test -L .claude/skills/jd
          test -f .agents/skills/jd/SKILL.md
          bash scripts/install-hooks.sh
          test "$(git config --get core.hooksPath)" = hooks
          bash verify.sh
          git status --short
          '@
          wsl -d Ubuntu -- bash -c $smoke -- $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
