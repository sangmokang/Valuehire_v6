name: mail-governance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mail decisions, immutable journal and coverage regressions
        run: python3 -m unittest tools.mail_governance.test_core -v
      - name: Compile mail governance modules
        run: python3 -m compileall -q tools/mail_governance
