# fixture: path 가 존재하지 않는 항목 — 검사기가 exit 1 을 내야 한다 (AC-M fixture 2/3)
# stage 는 ci 로 둔다: pre-push 면 죽은 target 검사(규칙 3)의 grep 이 없는 파일에서
# 실패해 규칙 2 의 삭제를 가려준다(2026-08-12 뮤테이션 M1 실측 — 규칙 2 를 지워도
# 초록이었다). ci + 유효한 ci_mirror_job 이면 규칙 2 만이 이 fixture 의 유일한 방어선이다.
- id: "ghost-mechanism"
  path: "scripts/this-file-does-not-exist.sh"
  target: "bash scripts/this-file-does-not-exist.sh"
  stage: "ci"
  ci_mirror_job: "verify"
  required: true
