# mechanism-registry.yaml — 이 저장소의 검사 장치 명부 (SOT · AC-M)
#
# 계약: docs/engineering/verify-ac-m-goal-2026-08-12.md §⑩ (파서가 받는 유일한 형태)
# 대조: scripts/verify/check-mechanism-registry.sh 가 pre-push 글로브와 CI 에서
#       이 명부의 모든 항목을 실제 파일·문구와 대조한다. 명부가 실제와 어긋나면 빨간불.
# 규칙: target 은 함수명이 아니라 path 파일 안에 문자 그대로 존재하는 명령 문자열이다.
#       stage: manual 은 AC-20(memory-recall-check.sh) 착수 시에만 추가하고
#       manual_reason 필수 (verify-unification-goal-2026-08-10.md AC-M counter-AC).
- id: "secrets-scan-precommit"
  path: "hooks/pre-commit"
  target: "SECRET_PATTERNS_FILE= VERIFY_SCAN_SOURCE=index bash verify.sh"
  stage: "pre-commit"
  required: true
- id: "acceptance-glob-prepush"
  path: "hooks/pre-push"
  target: "-name 'verify.sh' -o -name 'acceptance-*.sh'"
  stage: "pre-push"
  required: true
- id: "ci-secret-scan"
  path: ".github/workflows/verify.yml"
  target: "run: bash verify.sh"
  stage: "ci"
  ci_mirror_job: "verify"
  required: true
- id: "principles-local-check"
  path: "scripts/acceptance-principles-check.sh"
  target: "VERDICT: PASS"
  stage: "manual"
  manual_reason: "Strict 시작 시 현재 저장소 정본을 직접 읽는 원명령"
  required: true
- id: "principles-explicit-prepush"
  path: "hooks/pre-push"
  target: "bash scripts/acceptance-principles-check.sh"
  stage: "pre-push"
  required: true
- id: "principles-explicit-ci"
  path: ".github/workflows/verify.yml"
  target: "run: bash scripts/verify/run-acceptance.sh scripts/acceptance-principles-check.sh"
  stage: "ci"
  ci_mirror_job: "verify"
  required: true
- id: "p3-lint-precommit"
  path: "hooks/pre-commit"
  target: "bash ${p3_tmp}/lint.sh"
  stage: "pre-commit"
  required: true
- id: "p3-lint-ci"
  path: ".github/workflows/verify.yml"
  target: "bash scripts/verify/run-acceptance.sh scripts/acceptance-silent-failure-lint.sh"
  stage: "ci"
  ci_mirror_job: "verify"
  required: true
- id: "p3-lint-mutations-ci"
  path: ".github/workflows/verify.yml"
  target: "bash scripts/verify/run-acceptance.sh scripts/acceptance-silent-failure-lint-mutations.sh"
  stage: "ci"
  ci_mirror_job: "verify"
  required: true
- id: "acceptance-runner-ci"
  path: ".github/workflows/verify.yml"
  target: "bash scripts/verify/run-acceptance.sh"
  stage: "ci"
  ci_mirror_job: "verify"
  required: true
- id: "acceptance-semantics-ci"
  path: ".github/workflows/verify.yml"
  target: "run: bash scripts/verify/run-acceptance.sh scripts/acceptance-semantic-mutations.sh"
  stage: "ci"
  ci_mirror_job: "verify"
  required: true
- id: "acceptance-runner-gate"
  path: "scripts/verify/run-acceptance.sh"
  target: "판정을 한 건도 내놓지 않았다"
  stage: "manual"
  manual_reason: "래퍼 자신의 판정 문구. 실행 배선은 acceptance-runner-ci 가 대조한다"
  required: true
- id: "ci-step-integrity-ci"
  path: ".github/workflows/verify.yml"
  target: "run: bash scripts/verify/run-acceptance.sh scripts/acceptance-ci-step-integrity.sh"
  stage: "ci"
  ci_mirror_job: "verify"
  required: true
- id: "ci-step-integrity-checker"
  path: "scripts/verify/check-ci-step-integrity.sh"
  target: "조건부 스텝은 조건이 거짓이면 실행되지 않고도 초록이다"
  stage: "manual"
  manual_reason: "검사기 자신의 판정 문구. 실행 배선은 ci-step-integrity-ci 가 대조한다"
  required: true
- id: "hs-browser-policy-ci"
  path: ".github/workflows/verify.yml"
  target: "bash scripts/verify/run-acceptance.sh scripts/acceptance-hs-browser-policy.sh"
  stage: "ci"
  ci_mirror_job: "verify"
  required: true
- id: "hs-browser-policy-mutations-ci"
  path: ".github/workflows/verify.yml"
  target: "bash scripts/verify/run-acceptance.sh scripts/acceptance-hs-browser-policy-mutations.sh"
  stage: "ci"
  ci_mirror_job: "verify"
  required: true
- id: "verified-sha-ci"
  path: ".github/workflows/verify.yml"
  target: "run: bash scripts/verify/run-acceptance.sh scripts/acceptance-verified-sha.sh"
  stage: "ci"
  ci_mirror_job: "verify"
  required: true
- id: "verified-sha-checker"
  path: "scripts/verify/check-verified-sha.sh"
  target: "VERDICT: UNVERIFIED"
  stage: "manual"
  manual_reason: "원격 조회가 필요해 CI 안에서 자기 SHA 를 검사하는 것은 뜻이 없다. 머지 전 판정 도구"
  required: true
- id: "invoice-acceptance-ci"
  path: ".github/workflows/verify.yml"
  target: "run: bash scripts/verify/run-acceptance.sh scripts/acceptance-invoice.sh"
  stage: "ci"
  ci_mirror_job: "verify"
  required: true
- id: "invoice-independent-runtime-ci"
  path: ".github/workflows/verify.yml"
  target: "python3 scripts/verify/check-invoice-gate.py"
  stage: "ci"
  ci_mirror_job: "verify"
  required: true
- id: "invoice-independent-unit-ci"
  path: "scripts/acceptance-invoice.sh"
  target: "python3 -m unittest discover -s tools/invoice/tests -v"
  stage: "ci"
  ci_mirror_job: "verify"
  required: true
- id: "invoice-postgres-runtime-ci"
  path: "scripts/acceptance-invoice.sh"
  target: "bash tools/invoice/tests/test_postgres_integrity.sh"
  stage: "ci"
  ci_mirror_job: "verify"
  required: true
