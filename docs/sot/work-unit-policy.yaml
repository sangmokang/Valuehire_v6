version: 2
title: "Work Unit TDD and context policy"
work_unit:
  claims_per_unit: 1
  acceptance_criteria_per_unit: 1
  counter_acceptance_criteria_minimum: 1
  required_contracts:
    - input
    - output
    - errors
    - boundaries
    - database
    - api
    - types
  completion_requires:
    - red_validation
    - first_green
    - regression_validation
    - adversarial_validation
    - context_manifest
    - completion_commit
tdd:
  contract_commit_precedes_red: true
  authority_evidence_paths_minimum: 1
  authority_evidence_must_exist_at_contract_commit: true
  red_commands_minimum: 1
  red_tests_minimum: 1
  red_failure_kind: "missing_behavior"
  forbidden_red_failure_kinds:
    - syntax_error
    - import_error
    - collection_error
    - no_tests
  test_files_immutable_after_red: true
  expectation_change_requires_separate_approved_commit: true
  expectation_approval_must_not_be_green_commit: true
  expectation_approval_follows_first_green: true
  red_command_entrypoint_immutable_through_first_green: true
  first_green_requires_non_test_change: true
  first_green_required_before_completion: true
  completion_commit_required: true
  completion_commit_follows_first_green: true
  manifest_order_requires_prior_completion: true
context:
  declared_files_only: true
  repository_relative_paths_only: true
  required_evidence:
    - path
    - commit_sha
    - sha256
    - read_evidence
  observed_reads_required: true
  declared_and_observed_reads_must_match: true
  require_expected_head_match: true
  require_expected_worktree_match: true
  historical_worktree_requires_contract_evidence: true
  whole_repository_is_not_evidence: true
  maximum_files_per_unit: 20
  near_whole_repository_omission_minimum: 2
not_applicable:
  allowed_change_kinds:
    - ui
    - documentation
    - configuration
    - migration
    - other_test_inappropriate
  requires_reason: true
  alternative_validation_commands_minimum: 1
completion:
  approved_commands:
    - "bash scripts/acceptance-work-unit-contract.sh schema"
    - "bash scripts/acceptance-work-unit-contract.sh tdd"
    - "bash scripts/acceptance-work-unit-contract.sh context"
    - "bash scripts/acceptance-work-unit-contract.sh not-applicable"
    - "bash scripts/acceptance-work-unit-contract-mutations.sh"
    - "bash scripts/acceptance-semantic-mutations.sh"
enforcement:
  manifest_required: true
  missing_manifest_status: "FAIL"
  required_repository_work_unit_ids:
    - "WU-1"
    - "WU-2"
    - "WU-3"
    - "WU-4"
    - "WU-5"
  repository_manifest_directory: "docs/engineering/work-units"
  repository_manifest_acceptance: "scripts/acceptance-work-unit-repository.sh"
  repository_manifest_must_run_in_ci: true
  all_validation_modes_required_in_ci: true
  pre_push_acceptance_glob_required: true
  checker: "scripts/verify/check-work-unit-manifest.rb"
  acceptance: "scripts/acceptance-work-unit-contract.sh"
  mutations: "scripts/acceptance-work-unit-contract-mutations.sh"
  fixture_directory: "scripts/verify/fixtures/work-unit"
