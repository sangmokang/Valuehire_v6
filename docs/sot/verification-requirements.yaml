schema_version: 1
required_check: verify
workflow_identity: .github/workflows/verify.yml@verify
mutation_expected_count: 23
mutation_catalog:
  - verifier_early_exit_zero
  - ci_echo_command
  - ci_comment_only
  - ci_dead_code_before_command
  - artifact_sha_unbound
  - output_sha_comment_only
  - required_checker_deleted
  - required_registry_renamed
  - mutation_case_deleted
  - mutation_case_and_expected_count_lowered
  - counterexample_emptied
  - verifier_wiring_removed
  - manifest_and_checker_weakened
  - authority_implicit_verified_backdoor
  - mutation_runner_early_success
  - verified_sha_replaced_with_old_sha
  - pr_head_sha_changed
  - required_check_name_changed
  - workflow_identity_changed
  - forged_success_fixture
  - rollback_permission_restore_failure
  - rollback_state_delete_attempt
  - normal_control
protected_surface:
