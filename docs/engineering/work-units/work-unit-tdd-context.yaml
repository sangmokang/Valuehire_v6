  - id: "WU-5"
    claim: "Independent mutation checks detect disabled Work Unit checkers and CI wiring."
    acceptance_criterion: "If the checker or CI command is changed to exit zero, no-op, echo-only, or an always-false condition, the mutation acceptance shall observe a failure."
    counter_acceptance_criteria:
      - "A disabled checker or skipped CI command remains green."
    contracts:
      input: "Synthetic checker and CI mutations plus the real acceptance commands."
      output: "Each mutation is killed and the unmodified gate passes."
      errors: "A surviving mutation, missing command, no verdict, or changed original worktree fails."
      boundaries:
        - "Fixtures prove the checker; repository manifests separately prove real WU adoption."
      database:
        status: "NOT_APPLICABLE"
        reason: "Mutation fixtures use temporary files and no persistent data."
        paths:
