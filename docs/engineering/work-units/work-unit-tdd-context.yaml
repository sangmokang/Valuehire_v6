  - id: "WU-3"
    claim: "Declared AI context is limited to hashed repository files at the declared commit."
    acceptance_criterion: "When context evidence is checked, the system shall require matching path, commit, hash, read receipt, HEAD, worktree, and declared/observed read sets."
    counter_acceptance_criteria:
      - "A filename without a read receipt passes."
      - "A stale HEAD, another worktree, or the entire repository passes as evidence."
    contracts:
      input: "A minimal list of repository paths with commit SHA, SHA-256, and read receipts."
      output: "A current active-context verdict or a reproducible historical contract-context verdict."
      errors: "Missing files, mismatched hashes, stale active HEAD, or extra reads fail."
      boundaries:
        - "Historical manifests validate against each WU contract commit; active manifests validate against current HEAD and worktree."
      database:
        status: "NOT_APPLICABLE"
        reason: "Context validation reads Git blobs rather than database state."
        paths:
          - "docs/engineering/work-unit-tdd-context-goal-2026-09-10.md"
      api:
        status: "NOT_APPLICABLE"
        reason: "Context validation performs no network or external API calls."
        paths:
          - "docs/engineering/work-unit-tdd-context-goal-2026-09-10.md"
      types:
        status: "APPLICABLE"
        reason: "The policy YAML defines context evidence fields and scope."
        paths:
          - "docs/sot/work-unit-policy.yaml"
