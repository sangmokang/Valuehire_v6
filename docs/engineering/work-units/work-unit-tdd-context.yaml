  - id: "WU-1"
    claim: "Incomplete or duplicate Work Unit contracts are rejected."
    acceptance_criterion: "When a manifest is checked, the system shall accept only a Work Unit with one AC, at least one counter-AC, every required contract, and a unique ID."
    counter_acceptance_criteria:
      - "A named file without an AC or counter-AC passes."
      - "Two Work Units with the same ID pass."
    contracts:
      input: "One repository-relative YAML Work Unit manifest."
      output: "A PASS verdict with a positive checked count, or a closed failure."
      errors: "Missing fields, unknown fields, duplicate IDs, and malformed YAML fail."
      boundaries:
        - "Exactly one falsifiable claim and one acceptance criterion per Work Unit."
      database:
        status: "NOT_APPLICABLE"
        reason: "This schema checker does not access persistent data or migrations."
        paths:
          - "docs/engineering/work-unit-tdd-context-goal-2026-09-10.md"
      api:
        status: "NOT_APPLICABLE"
        reason: "This schema checker has no network or external API boundary."
