  - id: "WU-4"
    claim: "A test-inappropriate change cannot skip verification without a reason and executable substitute."
    acceptance_criterion: "If TDD is NOT_APPLICABLE, the system shall accept only an allowed change kind with a concrete reason and at least one passing alternative validation command."
    counter_acceptance_criteria:
      - "An empty reason, zero commands, or an arbitrary change kind passes."
    contracts:
      input: "A NOT_APPLICABLE declaration or a normal RED_GREEN declaration."
      output: "A validated exemption with executed substitute evidence, or a normal TDD result."
      errors: "Missing reason, invalid kind, empty commands, mixed modes, or failing substitutes fail."
      boundaries:
        - "Only UI, documentation, configuration, migration, and explicitly test-inappropriate work may use the exemption."
      database:
        status: "NOT_APPLICABLE"
        reason: "This Work Unit adds the exemption checker and no migration or database state."
        paths:
          - "docs/engineering/work-unit-tdd-context-goal-2026-09-10.md"
      api:
