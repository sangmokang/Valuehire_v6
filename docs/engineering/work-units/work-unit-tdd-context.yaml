  - id: "WU-2"
    claim: "Only behavior-missing RED evidence and immutable test expectations establish a valid first GREEN."
    acceptance_criterion: "When RED and GREEN history is checked, the system shall replay a positive test count, reject syntax/import-only failures, and reject unapproved test changes through current HEAD."
    counter_acceptance_criteria:
      - "A zero-test or syntax-only RED is accepted."
      - "An implementation commit can silently rewrite test expectations."
    contracts:
      input: "Contract, RED, GREEN commits plus replayable commands and declared test files."
      output: "Validated RED cause, first GREEN, and post-RED test immutability."
      errors: "Missing commits, invalid ordering, false RED, or unapproved test drift fail."
      boundaries:
        - "Database/API contract and manifest Type evidence must exist at the contract commit."
      database:
        status: "NOT_APPLICABLE"
        reason: "The Git evidence checker reads repository objects only."
        paths:
          - "docs/engineering/work-unit-tdd-context-goal-2026-09-10.md"
      api:
        status: "NOT_APPLICABLE"
        reason: "The Git evidence checker performs no external API calls."
