[project]
name = "humansearch"
version = "0.1.0"
description = "HumanSearch v6 clean-room source package with L0 auth surface classification"
requires-python = ">=3.14"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

# hypothesis 는 L0 인증 화면 분류기의 P5 속성 기반 시험에서 사용한다.
[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.ruff]
line-length = 100
