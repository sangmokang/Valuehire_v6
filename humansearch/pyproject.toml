[project]
name = "humansearch"
version = "0.1.0"
description = "HumanSearch v6 clean-room source package with L0 auth surface classification"
requires-python = ">=3.14"

# hypothesis 는 L0 인증 화면 분류기의 P5 속성 기반 시험에서 사용한다.
[dependency-groups]
dev = [
    "hypothesis>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
]

# L0 제품 로직은 존재하지만 빌드 설정·실행 진입점·배포 소비자는 아직 없다.
# 현재 검증은 src 경로를 명시해 불러오므로 배포 계약이 생기기 전까지 패키지 빌드는 하지 않는다.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.ruff]
line-length = 100
